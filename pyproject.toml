[build-system]
requires = ["setuptools==65.5.0"]
build-backend = "setuptools.build_meta"
[project]
name = "llm-escalation-study"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "PyYAML==6.0.2", "scikit-learn==1.6.1", "matplotlib==3.10.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/synthetic"]
